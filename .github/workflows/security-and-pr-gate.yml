name: Security & Merge Gate Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  security-audit:
    name: Dependency Security & Code Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Verify TypeScript & Build
        run: |
          npm run build:electron
          npm run build:renderer

  pr-merge-gate:
    name: PR Governance & Review Policy Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pull Request Governance
        run: |
          echo "=========================================================="
          echo "Kernel Base PR Governance Check"
          echo "=========================================================="
          echo "• Branch Protection: Main branch requires ≥ 1 approving review."
          echo "• Admin Bypass: Enabled for @Sujoymoulick (Admin authority)."
          echo "• Author: ${{ github.actor }}"
          echo "=========================================================="
